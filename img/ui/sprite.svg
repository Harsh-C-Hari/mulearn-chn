<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
<!-- µLearn CHN sprite · single source of truth (edit here, then run scripts/sync_sprite.py).
     Stickers are flat colour only. Fill and stroke come from CSS custom properties set in css/decor.css
     (fill, fill-2, line, each prefixed with two hyphens) so one symbol can take any palette colour. -->

<!-- ============ ICONS (24×24, stroke = currentColor; styled by .icon) ============ -->
<symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6.5L20.5 7"/></symbol>
<symbol id="i-external-link" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>

<!-- ============ STICKERS (viewBox 100×100 unless noted) ============ -->
<!-- 8-arm asterisk (Board 1 hero/logo star) -->
<symbol id="s-asterisk" viewBox="0 0 100 100"><g style="fill:var(--fill,#6366F1)"><rect x="43" y="4" width="14" height="92" rx="7"/><rect x="43" y="4" width="14" height="92" rx="7" transform="rotate(45 50 50)"/><rect x="43" y="4" width="14" height="92" rx="7" transform="rotate(90 50 50)"/><rect x="43" y="4" width="14" height="92" rx="7" transform="rotate(135 50 50)"/></g></symbol>
<!-- 6-arm asterisk (the heavier, shorter one used on the Board 1 hero) -->
<symbol id="s-asterisk-6" viewBox="0 0 100 100"><g style="fill:var(--fill,#6366F1)"><rect x="41" y="6" width="18" height="88" rx="9"/><rect x="41" y="6" width="18" height="88" rx="9" transform="rotate(60 50 50)"/><rect x="41" y="6" width="18" height="88" rx="9" transform="rotate(120 50 50)"/></g></symbol>
<!-- 5-point star with navy outline -->
<symbol id="s-star" viewBox="0 0 100 100"><path d="m50 7 12.2 25.6 28 3.6-20.5 19.6 5.2 27.9L50 69.2 25.1 83.7l5.2-27.9L9.8 36.2l28-3.6Z" style="fill:var(--fill,#FACC15);stroke:var(--line,#0F172A);stroke-width:var(--line-w,3);stroke-linejoin:round"/></symbol>
<!-- 4-point sparkle, flat -->
<symbol id="s-sparkle" viewBox="0 0 100 100"><path d="M50 4c3 26 20 43 46 46-26 3-43 20-46 46-3-26-20-43-46-46C30 47 47 30 50 4Z" style="fill:var(--fill,#FACC15);stroke:var(--line,none);stroke-width:var(--line-w,0);stroke-linejoin:round"/></symbol>
<!-- triangle (mint, Board 1) -->
<symbol id="s-triangle" viewBox="0 0 100 100"><path d="M50 10 94 88H6Z" style="fill:var(--fill,#34D399);stroke:var(--line,none);stroke-width:var(--line-w,0);stroke-linejoin:round"/></symbol>
<!-- quarter circle (indigo, bottom of hero) -->
<symbol id="s-quarter" viewBox="0 0 100 100"><path d="M0 100V0a100 100 0 0 1 100 100Z" style="fill:var(--fill,#6366F1)"/></symbol>
<!-- slab: tilted parallelogram (hero top-right, Join corner) -->
<symbol id="s-slab" viewBox="0 0 140 100"><path d="M26 4h110L114 96H4Z" style="fill:var(--fill,#6366F1);stroke:var(--line,none);stroke-width:var(--line-w,0);stroke-linejoin:round"/></symbol>
<!-- ink blob: heavy angular-organic navy shape (Board 2) -->
<symbol id="s-blob-ink" viewBox="0 0 160 140"><path d="M20 38C26 12 62 4 92 10c34 7 62 28 64 58 2 30-24 64-62 66-30 2-44-16-66-22C8 105 12 62 20 38Z" style="fill:var(--fill,#0F172A)"/></symbol>
<!-- ink slab: tall black wedge (Board 2 hero) -->
<symbol id="s-wedge-ink" viewBox="0 0 120 160"><path d="M30 0h90L96 160H0Z" style="fill:var(--fill,#0F172A)"/></symbol>
<!-- scalloped edge strip: hard-edged bumps for lavender → cream transitions (Board 2 wave, kept geometric) -->
<symbol id="s-scallop" viewBox="0 0 120 24" preserveAspectRatio="none"><path d="M0 0h120v10c-10 0-10 14-20 14S90 10 80 10 70 24 60 24 50 10 40 10 30 24 20 24 10 10 0 10Z" style="fill:var(--fill,#DDD6FE)"/></symbol>
<!-- squiggle (yellow tilde, Board 1) · viewBox 160×60 -->
<symbol id="s-squiggle" viewBox="0 0 160 60"><path d="M8 38C26 8 46 6 66 26s40 24 62-2c8-10 16-14 26-12" style="fill:none;stroke:var(--fill,#FACC15);stroke-width:14;stroke-linecap:round;stroke-linejoin:round"/></symbol>
<!-- hand-drawn loop line (Join banner) · viewBox 220×120 -->
<symbol id="s-loop" viewBox="0 0 220 120"><path d="M6 108C60 112 96 100 104 62 110 30 88 10 72 22c-18 14 2 62 40 74 38 12 70-8 108-14" style="fill:none;stroke:var(--line,#0F172A);stroke-width:var(--line-w,4);stroke-linecap:round;stroke-linejoin:round"/></symbol>
<!-- underline stroke · viewBox 200×20 -->
<symbol id="s-underline" viewBox="0 0 200 20"><path d="M4 13C40 4 80 4 104 9s60 4 92-4" style="fill:none;stroke:var(--fill,#6366F1);stroke-width:6;stroke-linecap:round"/></symbol>
<!-- arc ring: open arc, two colours (About star ring) -->
<symbol id="s-arc" viewBox="0 0 120 120"><path d="M20 98A56 56 0 1 1 100 96" style="fill:none;stroke:var(--fill,#FACC15);stroke-width:5;stroke-linecap:round"/><path d="M100 96a56 56 0 0 1-18 12" style="fill:none;stroke:var(--fill-2,#6366F1);stroke-width:5;stroke-linecap:round"/></symbol>
<!-- solid circle + diamond icon (Board 2 panel) -->
<symbol id="s-circle-diamond" viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" style="fill:var(--fill,#6366F1)"/><path d="M60 30 90 60 60 90 30 60Z" style="fill:none;stroke:var(--line,#0F172A);stroke-width:5;stroke-linejoin:round"/><path d="M60 30v60M30 60h60" style="fill:none;stroke:var(--line,#0F172A);stroke-width:4"/></symbol>
<!-- dotted grid pattern (faint, behind hero & polaroids) -->
<symbol id="s-dots" viewBox="0 0 120 120"><g style="fill:var(--fill,#0F172A)"><circle cx="10" cy="10" r="3"/><circle cx="40" cy="10" r="3"/><circle cx="70" cy="10" r="3"/><circle cx="100" cy="10" r="3"/><circle cx="10" cy="40" r="3"/><circle cx="40" cy="40" r="3"/><circle cx="70" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="10" cy="70" r="3"/><circle cx="40" cy="70" r="3"/><circle cx="70" cy="70" r="3"/><circle cx="100" cy="70" r="3"/><circle cx="10" cy="100" r="3"/><circle cx="40" cy="100" r="3"/><circle cx="70" cy="100" r="3"/><circle cx="100" cy="100" r="3"/></g></symbol>
<!-- line grid (the faint graph-paper block behind the hero) -->
<symbol id="s-grid" viewBox="0 0 120 120"><path d="M0 0h120v120H0Z M30 0v120M60 0v120M90 0v120M0 30h120M0 60h120M0 90h120" style="fill:none;stroke:var(--line,#0F172A);stroke-width:1.5"/></symbol>
<!-- sticker bolt: a chunky lightning bolt (tech cue) -->
<symbol id="s-bolt" viewBox="0 0 100 100"><path d="M58 4 18 56h26l-8 40 46-56H54Z" style="fill:var(--fill,#FACC15);stroke:var(--line,#0F172A);stroke-width:var(--line-w,4);stroke-linejoin:round"/></symbol>
</svg>
